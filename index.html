    <!-- Set the theme before first paint so there is no flash. Dark is the default. -->
    <script>
      (function () {
        var t = "dark";
        try { var s = localStorage.getItem("kj-theme"); if (s === "light" || s === "dark") t = s; } catch (e) {}
        document.documentElement.classList.toggle("dark", t === "dark");
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#fafaf9" : "#0a0a0a");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript. Find me on GitHub: github.com/khaliljabour4</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
